# Alembic configuration for the Vexer platform.
#
# The database URL is intentionally ABSENT. It is supplied at run time from the
# VEXER_POSTGRES_DSN environment variable (see migrations/env.py) so that no credential can ever be
# committed (mandate §29, §32). Alembic therefore requires an explicit target and will refuse to
# guess one.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# file_template is pinned so revision filenames sort chronologically and stay predictable (§4).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# No automatic formatting hook: hooks that mutate files outside a reviewed commit are a supply-chain
# risk, and this repository formats explicitly in CI instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
